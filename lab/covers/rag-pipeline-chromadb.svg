<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="RAG Pipeline">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b0764"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#fff" stroke-opacity=".08"/></pattern></defs>
<rect width="600" height="400" fill="url(#g)"/><rect width="600" height="400" fill="url(#grid)"/>
<circle cx="520" cy="80" r="140" fill="#fff" fill-opacity=".06"/><circle cx="560" cy="330" r="90" fill="#fff" fill-opacity=".05"/>
<g transform="translate(400 60)"><g stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".85"><path d="M15 40 h30 M15 80 h30 M15 120 h30"/><rect x="55" y="25" width="40" height="110" rx="8"/><path d="M65 50h20M65 70h20M65 90h20M65 110h20"/></g><g stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M95 80 H125"/></g><circle cx="140" cy="80" r="14" fill="#fff"/></g>
<text x="40" y="70" font-size="14" font-weight="600" letter-spacing="3" fill="#fff" fill-opacity=".8" font-family="Poppins,Helvetica,Arial,sans-serif">SCRAPE → EMBED → CHROMADB → OLLAMA</text>
<text x="40" y="130" font-size="30" font-weight="700" fill="#fff" font-family="Poppins,Helvetica,Arial,sans-serif">RAG Pipeline</text>
<text x="40" y="330" font-size="56" font-weight="700" fill="#fff" font-family="Poppins,Helvetica,Arial,sans-serif">Dockerised</text>
<text x="40" y="360" font-size="15" fill="#fff" fill-opacity=".85" font-family="Poppins,Helvetica,Arial,sans-serif">chunk × overlap × embedding model evaluated on fixed queries</text>
